name: tolong_flutter
description: TolongApp — calm, offline-first disaster preparedness for every household.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  flutter_svg: ^2.0.10
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^10.2.2
  maplibre_gl: ^0.27.1
  path_provider: ^2.1.6
  geolocator: ^14.1.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/fonts/DMSans-OFL.txt
    - assets/fonts/Fraunces-OFL.txt
    # Quezon City basemap and NOAH modelled-hazard overlays, both clipped from national archives.
    # Bundled rather than downloaded so the hazard map works with no connection, which is the
    # point of the app. ~77 MB total; see docs/design/MAP_OPTIONS.md before swapping either out.
    - datasets/qc_base.pmtiles
    - datasets/qc_flood.pmtiles
  # Bundled (OFL) so text looks right on first launch without internet and no font requests leave the phone.
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
